<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f2f8;font-family:Arial,Helvetica,sans-serif;color:#222;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2f8;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#5f2e96;padding:18px 24px;">
          <span style="display:inline-block;background:#ffffff;border-radius:8px;padding:4px;vertical-align:middle;line-height:0;"><img src="https://jeropay.com.ng/static/img/logo-1.png" alt="JeroPay" height="30" style="display:block;border:0;"></span>
          <span style="color:#ffffff;font-size:20px;font-weight:bold;vertical-align:middle;margin-left:8px;">JeroPay</span>
        </td></tr>
        <tr><td style="padding:24px;font-size:15px;line-height:1.6;color:#222;">
          {{ body_html|safe }}
        </td></tr>
        <tr><td style="padding:16px 24px;border-top:1px solid #eee;font-size:12px;line-height:1.5;color:#777;">
          JeroPay &middot; <a href="https://jeropay.com.ng" style="color:#5f2e96;">jeropay.com.ng</a> &middot; support@jeropay.com.ng
          {% if unsubscribe_url %}<br>You received this because you have a JeroPay account. <a href="{{ unsubscribe_url }}" style="color:#777;">Unsubscribe</a>{% endif %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
